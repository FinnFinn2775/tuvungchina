<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ôn Tập Tiếng Trung</title>
    <!-- Thư viện Pinyin -->
    <script src="https://unpkg.com/pinyin-pro"></script>
    <!-- Thư viện Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --danger: #ff3b30;
            --warning: #ff9500;
            --bg-system: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-sub: #8e8e93;
            --border: #e5e5ea;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-system);
            color: var(--text-main);
            margin: 0;
            padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px) 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .iphone-container { width: 100%; max-width: 414px; display: flex; flex-direction: column; gap: 16px; position: relative; }

        .card-box {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
        }

        /* Hiệu ứng chuyển cảnh trang mượt mà */
        .page {
            display: none;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            width: 100%;
        }
        
        .page.active {
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 1;
            transform: translateY(0);
        }

        /* Tiêu đề & Nút bấm iOS */
        .page-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin: 0 0 4px 0;
            letter-spacing: -0.4px;
        }

        .btn-back {
            background: rgba(120, 120, 128, 0.12);
            color: var(--primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 600;
            font-size: 15px;
            border-radius: 12px;
            padding: 12px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* Thống kê từ vựng */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; text-align: center; }
        .stat-item { background: var(--bg-system); padding: 10px 4px; border-radius: 14px; }
        .stat-number { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
        .stat-label { font-size: 11px; color: var(--text-sub); margin-top: 2px; font-weight: 500; }
        
        .chart-wrapper { position: relative; width: 150px; height: 150px; margin: 0 auto; }
        .bar-chart-wrapper { position: relative; width: 100%; height: 200px; margin-top: 10px; }

        /* Form Nhập */
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 16px; background: #fafafa; outline: none; transition: border-color 0.2s; }
        .input-group input:focus { border-color: var(--primary); background: #fff; }
        .input-group input[readonly] { background-color: #e5e5ea; color: #3a3a3c; }

        button { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s ease, opacity 0.15s ease; }
        button:active { transform: scale(0.98); opacity: 0.85; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-menu { background: var(--card-bg); color: var(--text-main); text-align: left; padding: 16px 18px; font-size: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; border-radius: 16px; border: 1px solid rgba(0,0,0,0.02); }

        /* Segment Control (Lọc ngày) */
        .segment-control { display: flex; background: #e3e3e8; padding: 3px; border-radius: 10px; margin-bottom: 12px; }
        .segment-btn { padding: 8px; font-size: 13px; font-weight: 600; border-radius: 8px; border: none; background: transparent; color: var(--text-main); flex: 1; text-align: center; cursor: pointer; }
        .segment-btn.active { background: white; shadow: 0 2px 6px rgba(0,0,0,0.1); color: var(--primary); }

        /* Flashcard Area */
        .swipe-container { position: relative; width: 100%; height: 280px; perspective: 1000px; }
        .flashcard { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), left 0.3s ease, opacity 0.3s ease; cursor: pointer; user-select: none; }
        .flashcard.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 24px; background: var(--card-bg); box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid var(--border); padding: 20px; text-align: center; box-sizing: border-box;
        }

        .front { font-size: 54px; font-weight: 700; color: var(--text-main); }
        .back { transform: rotateY(180deg); background: #fcfcfd; }
        .pinyin-text { font-size: 26px; color: var(--danger); font-weight: 600; margin-bottom: 8px; }
        .meaning-text { font-size: 19px; color: var(--text-main); font-weight: 500; }
        .seen-badge { position: absolute; top: 16px; right: 18px; font-size: 12px; color: var(--text-sub); font-weight: 500; }

        /* Nút Công cụ Thẻ */
        .card-tools { position: absolute; top: 14px; left: 16px; display: flex; gap: 8px; z-index: 10; }
        .btn-tool { width: auto; padding: 6px 10px; font-size: 12px; border-radius: 8px; font-weight: 600; }
        .btn-edit { background: #e5e5ea; color: var(--primary); }
        .btn-delete { background: #ffe5e5; color: var(--danger); }

        .action-btns { display: flex; gap: 12px; }
        .btn-know { background: #e4f9e8; color: var(--success); }
        .btn-unknow { background: #ffe5e5; color: var(--danger); }
        .hint-swipe { text-align: center; font-size: 13px; color: var(--text-sub); }

        .streak-card { background: linear-gradient(135deg, #007aff, #5856d6); color: white; padding: 16px; border-radius: 18px; text-align: center; }
        .streak-number { font-size: 32px; font-weight: 800; }

        .detail-list { margin-top: 12px; max-height: 180px; overflow-y: auto; }
        .detail-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    </style>
</head>
<body>

<div class="iphone-container">

    <!-- 1. MÀN HÌNH CHÍNH -->
    <div id="page-home" class="page active">
        <h2 class="page-title">Ôn Tập Tiếng Trung</h2>
        
        <!-- Thống kê tổng quan từ vựng -->
        <div class="card-box">
            <h3 style="margin: 0 0 12px 0; font-size: 16px; text-align: center; color: var(--text-sub);">Thống Kê Từ Vựng</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">Tất cả từ</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="learnedCount" style="color: var(--success);">0</div>
                    <div class="stat-label">Đã thuộc</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="unlearnedCount" style="color: var(--danger);">0</div>
                    <div class="stat-label">Chưa thuộc</div>
                </div>
            </div>
            <div class="chart-wrapper"><canvas id="vocabChart"></canvas></div>
        </div>

        <!-- Danh mục nút điều hướng -->
        <button class="btn-menu" onclick="showPage('page-time-stats')">
            <span>📈 Thống Kê Thời Gian & Tiến Độ</span> <span>➔</span>
        </button>
        <button class="btn-menu" onclick="showPage('page-add')">
            <span>➕ Thêm Từ Vựng Mới</span> <span>➔</span>
        </button>
        <button class="btn-menu" onclick="startStudy('all')">
            <span>🎴 Ôn Tập Tất Cả Từ</span> <span>➔</span>
        </button>
        <button class="btn-menu" onclick="startStudy('unlearned')">
            <span>🎯 Chỉ Ôn Từ CHƯA THUỘC</span> <span>➔</span>
        </button>
    </div>

    <!-- 2. MÀN HÌNH THỐNG KÊ THỜI GIAN HỌC TẬP -->
    <div id="page-time-stats" class="page">
        <button class="btn-back" onclick="showPage('page-home')">⬅ Quay về ban đầu</button>

        <div class="streak-card">
            <div style="font-size: 13px; opacity: 0.9;">TỔNG SỐ NGÀY ĐÃ HỌC</div>
            <div class="streak-number" id="totalDaysCount">0 Ngày</div>
        </div>
        
        <div class="card-box">
            <div class="segment-control">
                <button class="segment-btn active" id="btn7" onclick="renderTimeStats(7)">7 Ngày</button>
                <button class="segment-btn" id="btn30" onclick="renderTimeStats(30)">30 Ngày</button>
                <button class="segment-btn" id="btn90" onclick="renderTimeStats(90)">90 Ngày</button>
            </div>

            <div class="bar-chart-wrapper">
                <canvas id="timeBarChart"></canvas>
            </div>

            <div class="detail-list" id="detailStatsList"></div>
        </div>
    </div>

    <!-- 3. MÀN HÌNH THÊM / SỬA TỪ -->
    <div id="page-add" class="page">
        <button class="btn-back" onclick="showPage('page-home')">⬅ Quay về ban đầu</button>
        <div class="card-box">
            <h3 style="margin: 0 0 14px 0; font-size: 18px;" id="formTitle">Thêm Từ Vựng Mới</h3>
            <div class="input-group">
                <label>Chữ Hán:</label>
                <input type="text" id="hanziInput" placeholder="Nhập chữ Hán..." oninput="autoPinyin()">
            </div>
            <div class="input-group">
                <label>Bính âm (Pinyin - Tự động):</label>
                <input type="text" id="pinyinInput" readonly placeholder="Tự động hiện Pinyin">
            </div>
            <div class="input-group">
                <label>Nghĩa Tiếng Việt:</label>
                <input type="text" id="meaningInput" placeholder="Nhập nghĩa giải thích...">
            </div>
            <button class="btn-primary" id="saveBtn" onclick="addOrUpdateWord()">Lưu Từ Vựng</button>
            <button class="btn-back" id="cancelEditBtn" onclick="resetForm()" style="display:none; margin-top:8px;">Hủy Chỉnh Sửa</button>
        </div>
    </div>

    <!-- 4. MÀN HÌNH FLASHCARD ÔN TẬP -->
    <div id="page-flashcard" class="page">
        <button class="btn-back" onclick="showPage('page-home')">⬅ Quay về ban đầu</button>
        
        <div class="hint-swipe">👈 Vuốt Trái: Đã thuộc | Vuốt Phải: Chưa thuộc 👉</div>
        <div class="swipe-container">
            <div class="flashcard" id="flashcard">
                <div class="card-face front">
                    <div class="card-tools" onclick="event.stopPropagation()">
                        <button class="btn-tool btn-edit" onclick="editCurrentCard()">✏️ Sửa</button>
                        <button class="btn-tool btn-delete" onclick="deleteCurrentCard()">🗑️ Xóa</button>
                    </div>
                    <span class="seen-badge" id="seenCount">Hiện: 0</span>
                    <span id="displayHanzi">Vui lòng thêm từ</span>
                </div>
                <div class="card-face back">
                    <div class="card-tools" onclick="event.stopPropagation()">
                        <button class="btn-tool btn-edit" onclick="editCurrentCard()">✏️ Sửa</button>
                        <button class="btn-tool btn-delete" onclick="deleteCurrentCard()">🗑️ Xóa</button>
                    </div>
                    <div class="pinyin-text" id="displayPinyin"></div>
                    <div class="meaning-text" id="displayMeaning"></div>
                </div>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn-know" onclick="markCard(true)">👈 Đã thuộc</button>
            <button class="btn-unknow" onclick="markCard(false)">Chưa thuộc 👉</button>
        </div>
    </div>

</div>

<script>
    const { pinyin } = pinyinPro;

    let vocabList = JSON.parse(localStorage.getItem('my_infinite_vocab')) || [];
    let dailyStats = JSON.parse(localStorage.getItem('my_daily_stats')) || {};
    let currentFilter = 'all';
    let currentCardIndex = -1;
    let editingId = null;
    
    let chartInstance = null;
    let timeChartInstance = null;
    let currentRange = 7;

    function getTodayKey() {
        const d = new Date();
        return d.toISOString().split('T')[0];
    }

    // Ghi nhận thời gian học thực tế
    setInterval(() => {
        const today = getTodayKey();
        if (!dailyStats[today]) {
            dailyStats[today] = { seconds: 0, wordsReviewed: 0 };
        }
        dailyStats[today].seconds += 1;
        localStorage.setItem('my_daily_stats', JSON.stringify(dailyStats));
    }, 1000);

    // Chuyển màn hình với hiệu ứng Fade In
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(page => {
            page.classList.remove('active');
        });
        const target = document.getElementById(pageId);
        target.classList.add('active');

        if (pageId === 'page-home') updateUI();
        if (pageId === 'page-time-stats') renderTimeStats(currentRange);
    }

    function startStudy(filter) {
        currentFilter = filter;
        showPage('page-flashcard');
        loadNextCard();
    }

    function autoPinyin() {
        const input = document.getElementById('hanziInput').value.trim();
        if (input) {
            document.getElementById('pinyinInput').value = pinyin(input, { toneType: 'symbol' });
        } else {
            document.getElementById('pinyinInput').value = '';
        }
    }

    function initChart() {
        const ctx = document.getElementById('vocabChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Đã thuộc', 'Chưa thuộc'],
                datasets: [{ data: [0, 0], backgroundColor: ['#34c759', '#ff3b30'], borderWidth: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }

    function updateUI() {
        const total = vocabList.length;
        const learned = vocabList.filter(v => v.status === 'learned').length;
        const unlearned = total - learned;

        document.getElementById('totalCount').innerText = total;
        document.getElementById('learnedCount').innerText = learned;
        document.getElementById('unlearnedCount').innerText = unlearned;

        if (chartInstance) {
            chartInstance.data.datasets[0].data = [learned, unlearned];
            chartInstance.update();
        }
    }

    // Vẽ biểu đồ cột Thống kê thời gian & số từ lướt (7 / 30 / 90 Ngày)
    function renderTimeStats(rangeDays) {
        currentRange = rangeDays;

        document.getElementById('btn7').classList.toggle('active', rangeDays === 7);
        document.getElementById('btn30').classList.toggle('active', rangeDays === 30);
        document.getElementById('btn90').classList.toggle('active', rangeDays === 90);

        // Đếm số ngày thực tế có học tập (> 0 giây hoặc > 0 từ)
        const activeDays = Object.keys(dailyStats).filter(key => dailyStats[key].seconds > 0 || dailyStats[key].wordsReviewed > 0).length;
        document.getElementById('totalDaysCount').innerText = `${activeDays} Ngày`;

        const labels = [];
        const minutesData = [];
        const wordsData = [];
        const detailListContainer = document.getElementById('detailStatsList');
        detailListContainer.innerHTML = '';

        for (let i = rangeDays - 1; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const key = d.toISOString().split('T')[0];
            const displayDate = `${d.getDate()}/${d.getMonth() + 1}`;
            
            const stats = dailyStats[key] || { seconds: 0, wordsReviewed: 0 };
            const mins = (stats.seconds / 60).toFixed(1);

            labels.push(displayDate);
            minutesData.push(mins);
            wordsData.push(stats.wordsReviewed);

            // Bảng danh sách chi tiết
            if (stats.seconds > 0 || stats.wordsReviewed > 0) {
                const row = document.createElement('div');
                row.className = 'detail-item';
                row.innerHTML = `
                    <span><strong>${displayDate}</strong></span>
                    <span>⏱️ ${Math.floor(stats.seconds / 60)} phút ${stats.seconds % 60}s | 🎴 ${stats.wordsReviewed} từ lướt</span>
                `;
                detailListContainer.appendChild(row);
            }
        }

        const ctx = document.getElementById('timeBarChart').getContext('2d');
        if (timeChartInstance) timeChartInstance.destroy();

        timeChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Số phút học',
                        data: minutesData,
                        backgroundColor: '#007aff',
                        borderRadius: 6
                    },
                    {
                        label: 'Từ lướt',
                        data: wordsData,
                        backgroundColor: '#ff9500',
                        borderRadius: 6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top', labels: { font: { size: 11 } } }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                    y: { grid: { color: '#e5e5ea' }, ticks: { font: { size: 10 } } }
                }
            }
        });
    }

    function addOrUpdateWord() {
        const hanzi = document.getElementById('hanziInput').value.trim();
        const py = document.getElementById('pinyinInput').value.trim();
        const meaning = document.getElementById('meaningInput').value.trim();

        if (!hanzi || !meaning) {
            alert('Vui lòng nhập Chữ Hán và Nghĩa!');
            return;
        }

        if (editingId) {
            const idx = vocabList.findIndex(v => v.id === editingId);
            if (idx !== -1) {
                vocabList[idx].hanzi = hanzi;
                vocabList[idx].pinyin = py;
                vocabList[idx].meaning = meaning;
            }
        } else {
            vocabList.push({
                id: Date.now(), hanzi: hanzi, pinyin: py, meaning: meaning, status: 'unlearned', seenCount: 0
            });
        }

        saveData();
        resetForm();
        alert('Đã lưu từ thành công!');
        showPage('page-home');
    }

    function editCurrentCard() {
        if (currentCardIndex === -1 || vocabList.length === 0) return;
        const item = vocabList[currentCardIndex];
        editingId = item.id;
        document.getElementById('hanziInput').value = item.hanzi;
        document.getElementById('pinyinInput').value = item.pinyin;
        document.getElementById('meaningInput').value = item.meaning;

        document.getElementById('formTitle').innerText = "Sửa Từ Vựng";
        document.getElementById('saveBtn').innerText = "Cập Nhật Từ";
        document.getElementById('cancelEditBtn').style.display = "block";
        showPage('page-add');
    }

    function deleteCurrentCard() {
        if (currentCardIndex === -1 || vocabList.length === 0) return;
        if (confirm("Bạn có chắc chắn muốn xóa từ này khỏi danh sách?")) {
            vocabList.splice(currentCardIndex, 1);
            saveData();
            loadNextCard();
        }
    }

    function resetForm() {
        editingId = null;
        document.getElementById('hanziInput').value = '';
        document.getElementById('pinyinInput').value = '';
        document.getElementById('meaningInput').value = '';
        document.getElementById('formTitle').innerText = "Thêm Từ Vựng Mới";
        document.getElementById('saveBtn').innerText = "Lưu Từ Vựng";
        document.getElementById('cancelEditBtn').style.display = "none";
    }

    function saveData() { localStorage.setItem('my_infinite_vocab', JSON.stringify(vocabList)); }

    function loadNextCard() {
        let pool = vocabList;
        if (currentFilter === 'unlearned') {
            pool = vocabList.filter(v => v.status === 'unlearned');
        }

        const cardElem = document.getElementById('flashcard');
        cardElem.classList.remove('flipped');

        if (pool.length === 0) {
            document.getElementById('displayHanzi').innerText = "Hết từ ôn!";
            document.getElementById('displayPinyin').innerText = "";
            document.getElementById('displayMeaning').innerText = "";
            document.getElementById('seenCount').innerText = "";
            currentCardIndex = -1;
            return;
        }

        pool.sort((a, b) => a.seenCount - b.seenCount);
        const minSeen = pool[0].seenCount;
        const candidatePool = pool.filter(v => v.seenCount === minSeen);

        const selected = candidatePool[Math.floor(Math.random() * candidatePool.length)];
        currentCardIndex = vocabList.findIndex(v => v.id === selected.id);

        document.getElementById('displayHanzi').innerText = selected.hanzi;
        document.getElementById('displayPinyin').innerText = selected.pinyin;
        document.getElementById('displayMeaning').innerText = selected.meaning;
        document.getElementById('seenCount').innerText = `Hiện: ${selected.seenCount}`;
    }

    function markCard(isLearned) {
        if (currentCardIndex === -1 || vocabList.length === 0) return;

        const item = vocabList[currentCardIndex];
        item.status = isLearned ? 'learned' : 'unlearned';
        item.seenCount += 1;

        // Cộng số lần lướt từ trong ngày
        const today = getTodayKey();
        if (!dailyStats[today]) dailyStats[today] = { seconds: 0, wordsReviewed: 0 };
        dailyStats[today].wordsReviewed += 1;
        localStorage.setItem('my_daily_stats', JSON.stringify(dailyStats));

        saveData();

        const cardElem = document.getElementById('flashcard');
        cardElem.style.transform = isLearned ? 'translateX(-120%) rotate(-10deg)' : 'translateX(120%) rotate(10deg)';
        cardElem.style.opacity = '0';

        setTimeout(() => {
            cardElem.style.transform = '';
            cardElem.style.opacity = '1';
            loadNextCard();
        }, 300);
    }

    document.getElementById('flashcard').addEventListener('click', function() {
        this.classList.toggle('flipped');
    });

    let startX = 0;
    const cardElem = document.getElementById('flashcard');
    cardElem.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
    cardElem.addEventListener('touchend', e => {
        let diffX = e.changedTouches[0].clientX - startX;
        if (diffX < -50) markCard(true);
        if (diffX > 50) markCard(false);
    });

    window.onload = function() {
        initChart();
        updateUI();
