<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="app_title">Ôn Tập Tiếng Trung</title>
    <script src="https://unpkg.com/pinyin-pro"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #007aff; --success: #34c759; --danger: #ff3b30; --warning: #ff9500;
            --bg-system: #f2f2f7; --card-bg: #ffffff; --text-main: #1c1c1e; --text-sub: #8e8e93; --border: #e5e5ea;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
            background-color: var(--bg-system); color: var(--text-main); margin: 0;
            padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px) 16px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
        }

        /* --- CANVAS VẬT LÝ --- */
        #physicsCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9998; opacity: 0.65;
        }

        /* --- CHÀO MỪNG --- */
        .welcome-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column;
            transition: opacity 0.6s, visibility 0.6s;
        }
        .welcome-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .welcome-content {
            text-align: center; transform: translateY(30px) scale(0.95); opacity: 0;
            animation: welcomePopUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 0.1s;
        }
        @keyframes welcomePopUp { to { transform: translateY(0) scale(1); opacity: 1; } }
        .welcome-icon { font-size: 64px; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
        .welcome-text { font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 4px; padding: 0 16px; }
        .welcome-event { font-size: 16px; font-weight: 700; color: var(--danger); margin-top: 8px; animation: pulse 2s infinite; display: none; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .iphone-container { width: 100%; max-width: 414px; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 2; }
        .stagger-item { opacity: 0; transform: translateY(20px) scale(0.98); visibility: hidden; }
        .stagger-item.show { visibility: visible; animation: popInStagger 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popInStagger { to { opacity: 1; transform: translateY(0) scale(1); } }

        .card-box { background: var(--card-bg); border-radius: 18px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.03); }
        .page { display: none; opacity: 0; transform: translateY(16px) scale(0.98); transition: opacity 0.4s, transform 0.4s; width: 100%; }
        .page.active { display: flex; flex-direction: column; gap: 16px; opacity: 1; transform: translateY(0) scale(1); }
        .page-title { font-size: 20px; font-weight: 700; text-align: center; margin: 0 0 4px 0; }

        button, .btn-menu, .stat-item, .segment-btn, .btn-back, .vocab-item { transition: transform 0.2s, box-shadow 0.2s, background 0.2s; cursor: pointer; }
        button:active, .btn-menu:active, .stat-item:active, .btn-back:active, .vocab-item:active { transform: scale(0.95); }
        .btn-back { background: rgba(120, 120, 128, 0.12); color: var(--primary); margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 15px; border-radius: 12px; padding: 12px; border: none; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; text-align: center; }
        .stat-item { background: var(--bg-system); padding: 8px 2px; border-radius: 12px; }
        .stat-item:hover { background: #e5e5ea; transform: translateY(-2px); }
        .stat-number { font-size: 17px; font-weight: 700; }
        .stat-label { font-size: 10px; color: var(--text-sub); margin-top: 2px; font-weight: 500; }
        
        .chart-wrapper { position: relative; width: 160px; height: 160px; margin: 0 auto; }
        .chart-center-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
        .chart-center-val { font-size: 22px; font-weight: 800; color: var(--primary); }
        .chart-center-lbl { font-size: 10px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; }
        .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; background: #fafafa; outline: none; font-family: inherit; }
        .input-group textarea { resize: vertical; min-height: 60px; }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.15); }
        
        button { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-menu { background: var(--card-bg); color: var(--text-main); text-align: left; padding: 16px 18px; font-size: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; border-radius: 16px; border: 1px solid rgba(0,0,0,0.02); }
        
        .backup-group { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
        .backup-row { display: flex; gap: 8px; }
        .btn-backup { background: rgba(0, 122, 255, 0.1); color: var(--primary); padding: 12px 8px; font-size: 13px; border-radius: 12px; flex: 1; font-weight: 600; }
        .btn-reset { background: rgba(255, 59, 48, 0.1); color: var(--danger); padding: 12px 8px; font-size: 13px; border-radius: 12px; font-weight: 600; }

        .swipe-container { position: relative; width: 100%; min-height: 340px; }
        .flashcard { width: 100%; min-height: 340px; position: relative; background: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid var(--border); padding: 48px 20px 24px 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; user-select: none; transition: all 0.3s; }
        .flashcard.learned-bg { background-color: #e4f9e8 !important; border-color: #34c759 !important; }
        .flashcard.unlearned-bg { background-color: #ffe5e5 !important; border-color: #ff3b30 !important; }
        .flashcard.card-exit { opacity: 0 !important; transform: scale(0.85) translateY(-20px) !important; }
        .flashcard.card-enter { animation: popInCard 0.4s forwards; }
        @keyframes popInCard { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .hanzi-display { font-size: 56px; font-weight: 700; margin-top: 10px; margin-bottom: 8px; word-break: break-all; }
        .card-details { display: none; width: 100%; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); animation: fadeIn 0.3s ease; }
        .card-details.show { display: block; }
        .pinyin-text { font-size: 24px; color: var(--danger); font-weight: 600; margin-bottom: 6px; }
        .meaning-text { font-size: 19px; font-weight: 500; }
        .example-box { margin-top: 10px; padding: 10px 12px; background: rgba(255, 149, 0, 0.08); border-radius: 12px; border-left: 3px solid var(--warning); text-align: left; font-size: 14px; color: #48484a; }
        .example-title { font-size: 11px; font-weight: 700; color: var(--warning); margin-bottom: 3px; }

        .card-tools { position: absolute; top: 12px; left: 14px; display: flex; gap: 6px; z-index: 10; }
        .btn-tool { width: auto; padding: 5px 8px; font-size: 11px; border-radius: 8px; font-weight: 600; }
        .action-btns { display: flex; gap: 12px; }
        .btn-know { background: #e4f9e8; color: var(--success); }
        .btn-unknow { background: #ffe5e5; color: var(--danger); }
        
        .vocab-list-container { display: flex; flex-direction: column; gap: 8px; max-height: 500px; overflow-y: auto; margin-top: 8px; }
        .vocab-item { background: var(--bg-system); padding: 12px 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: flex-start; }
        .vocab-item-left { display: flex; flex-direction: column; flex: 1; padding-right: 8px; }
        .vocab-item-hanzi { font-size: 19px; font-weight: 700; }
        .vocab-item-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
        .vocab-item-eg { font-size: 12px; color: #555; background: #e8e8ed; padding: 4px 8px; border-radius: 6px; margin-top: 4px; display: inline-block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<canvas id="physicsCanvas"></canvas>

<!-- CHÀO MỪNG -->
<div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-content">
        <div class="welcome-icon" id="welcomeIcon">🌅</div>
        <div class="welcome-text" id="welcomeText">Chào buổi sáng</div>
        <div class="welcome-event" id="welcomeEvent"></div>
    </div>
</div>

<div class="iphone-container">
    <!-- 1. HOME -->
    <div id="page-home" class="page active">
        <h2 class="page-title stagger-item" data-i18n="app_title">Ôn Tập Tiếng Trung</h2>
        <div class="card-box stagger-item physical-obstacle">
            <h3 style="margin: 0 0 12px 0; font-size: 16px; text-align: center; color: var(--text-sub);" data-i18n="stats_title">Thống Kê Từ Vựng</h3>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-number" id="totalCount" data-val="0">0</div><div class="stat-label">Tổng từ</div></div>
                <div class="stat-item"><div class="stat-number" id="learnedCount" data-val="0" style="color: var(--success);">0</div><div class="stat-label">Đã thuộc</div></div>
                <div class="stat-item"><div class="stat-number" id="unlearnedCount" data-val="0" style="color: var(--danger);">0</div><div class="stat-label">Chưa thuộc</div></div>
                <div class="stat-item"><div class="stat-number" id="unseenCount" data-val="0" style="color: #8e8e93;">0</div><div class="stat-label">Chưa xem</div></div>
            </div>
            <div class="chart-wrapper">
                <canvas id="vocabChart"></canvas>
                <div class="chart-center-text"><div class="chart-center-val" id="chartPercent" data-val="0">0%</div><div class="chart-center-lbl">Đã xem</div></div>
            </div>
        </div>
        <button class="btn-menu stagger-item physical-obstacle" style="background: #e4f2ff; border: 1px solid #b3d7ff;" onclick="startStudy('today')">
            <span style="color: var(--primary); font-weight:700;"><span data-i18n="btn_today">✨ Chỉ Ôn Từ Mới Thêm HÔM NAY</span> (<span id="todayCountBadge">0</span>)</span> <span>➔</span>
        </button>
        <button class="btn-menu stagger-item physical-obstacle" onclick="startStudy('unlearned')"><span data-i18n="btn_unlearned">🎯 Chỉ Ôn Từ CHƯA THUỘC</span> <span>➔</span></button>
        <button class="btn-menu stagger-item physical-obstacle" onclick="startStudy('all')"><span data-i18n="btn_all">🎴 Ôn Tập Tất Cả Từ</span> <span>➔</span></button>
        <button class="btn-menu stagger-item physical-obstacle" onclick="showPage('page-add')"><span data-i18n="btn_add">➕ Thêm Từ Vựng Mới</span> <span>➔</span></button>
        <button class="btn-menu stagger-item physical-obstacle" onclick="showPage('page-list')"><span data-i18n="btn_list">📋 Danh Sách Tất Cả Từ Vựng</span> <span>➔</span></button>
    </div>

    <!-- 2. ADD WORD -->
    <div id="page-add" class="page">
        <button class="btn-back physical-obstacle" onclick="showPage('page-home')">⬅ Quay về ban đầu</button>
        <div class="card-box physical-obstacle">
            <h3 style="margin: 0 0 14px 0; font-size: 18px;" id="formTitle">Thêm Từ Vựng Mới</h3>
            <div class="input-group"><label>Chữ Hán:</label><input type="text" id="hanziInput" oninput="autoPinyin()"></div>
            <div class="input-group"><label>Bính âm (Tự động):</label><input type="text" id="pinyinInput" readonly></div>
            <div class="input-group"><label>Nghĩa Tiếng Việt:</label><input type="text" id="meaningInput"></div>
            <div class="input-group"><label>Ví dụ (Tùy chọn):</label><textarea id="exampleInput"></textarea></div>
            <button class="btn-primary" id="saveBtn" onclick="addOrUpdateWord()">Lưu Từ Vựng</button>
            <button class="btn-back" id="cancelEditBtn" onclick="resetForm()" style="display:none; margin-top:8px;">Hủy Chỉnh Sửa</button>
        </div>
    </div>

    <!-- 3. LIST -->
    <div id="page-list" class="page">
        <button class="btn-back physical-obstacle" onclick="showPage('page-home')">⬅ Quay về ban đầu</button>
        <div class="card-box physical-obstacle">
            <h3 style="margin: 0 0 10px 0; font-size: 18px;" id="listTitleHeader">Tất Cả Từ Vựng (<span id="listTotalCount">0</span>)</h3>
            <div class="input-group" style="margin-bottom: 8px;"><input type="text" id="searchVocabInput" placeholder="🔍 Tìm kiếm..." oninput="renderVocabList()"></div>
            <div class="vocab-list-container" id="vocabListContainer"></div>
        </div>
    </div>

    <!-- 4. FLASHCARD -->
    <div id="page-flashcard" class="page">
        <button class="btn-back physical-obstacle" onclick="showPage('page-home')">⬅ Quay về ban đầu</button>
        <div class="swipe-container physical-obstacle">
            <div class="flashcard" id="flashcard">
                <div class="hanzi-display" id="displayHanzi">Vui lòng thêm từ</div>
                <div class="card-details" id="cardDetails">
                    <div class="pinyin-text" id="displayPinyin"></div>
                    <div class="meaning-text" id="displayMeaning"></div>
                    <div class="example-box" id="displayExampleBox" style="display:none;">
                        <div class="example-title">💡 VÍ DỤ:</div>
                        <div id="displayExampleText"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="action-btns physical-obstacle">
            <button class="btn-know" onclick="markCard(true)">👈 Đã thuộc</button>
            <button class="btn-unknow" onclick="markCard(false)">Chưa thuộc 👉</button>
        </div>
    </div>
</div>

<script>
    const { pinyin } = pinyinPro;
    let currentLang = 'vi';
    let vocabList = JSON.parse(localStorage.getItem('my_infinite_vocab')) || [];
    let currentCardIndex = -1;
    let chartInstance = null;
    let autoSpeechEnabled = true;

    function getTodayKey() { return new Date().toISOString().split('T')[0]; }

    // --- HIỆU ỨNG THỜI TIẾT, SỰ KIỆN & VẬT LÝ ---
    const canvas = document.getElementById('physicsCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let obstacles = [];
    let activeEmojis = ['✨', '🌸', '🍃']; // Default

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        updateObstacles();
    }
    window.addEventListener('resize', resizeCanvas);

    function updateObstacles() {
        obstacles = Array.from(document.querySelectorAll('.physical-obstacle')).map(el => {
            const rect = el.getBoundingClientRect();
            return { x: rect.left, y: rect.top, w: rect.width, h: rect.height };
        });
    }

    class Particle {
        constructor(emoji) {
            this.emoji = emoji;
            this.x = Math.random() * canvas.width;
            this.y = -30;
            this.size = Math.random() * 12 + 14;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = Math.random() * 2 + 1;
            this.rotation = Math.random() * 360;
            this.vRot = (Math.random() - 0.5) * 4;
            this.elasticity = 0.5 + Math.random() * 0.3; // Bounciness
        }
        update() {
            this.vy += 0.08; // Gravity
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.vRot;

            // Collision with obstacles
            for (let obs of obstacles) {
                if (this.x > obs.x && this.x < obs.x + obs.w &&
                    this.y + this.size/2 > obs.y && this.y - this.size/2 < obs.y + obs.h) {
                    
                    // Hit top of obstacle
                    if (this.vy > 0 && this.y < obs.y + 10) {
                        this.y = obs.y - this.size/2;
                        this.vy *= -this.elasticity;
                        this.vx *= 0.8; // Friction
                        this.vRot *= 0.8;
                    }
                }
            }

            // Reset if out of bounds
            if (this.y > canvas.height + 50) {
                this.y = -30;
                this.x = Math.random() * canvas.width;
                this.vy = Math.random() * 2 + 1;
                this.vx = (Math.random() - 0.5) * 2;
            }
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation * Math.PI / 180);
            ctx.font = `${this.size}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(this.emoji, 0, 0);
            ctx.restore();
        }
    }

    function animatePhysics() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        updateObstacles(); // Continuously update in case scrolling/animations move them
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animatePhysics);
    }

    async function initWeatherAndEvents() {
        const now = new Date();
        const hour = now.getHours();
        const d = now.getDate();
        const m = now.getMonth() + 1;

        // Xử lý Lời chào Thời gian
        let pVi = "", pZh = "", icon = "";
        if (hour >= 5 && hour < 12) { pVi = "buổi sáng"; pZh = "早上好"; icon = "🌅"; }
        else if (hour >= 12 && hour < 13) { pVi = "buổi trưa"; pZh = "中午好"; icon = "☀️"; }
        else if (hour >= 13 && hour < 18) { pVi = "buổi chiều"; pZh = "下午好"; icon = "☀️"; }
        else { pVi = "buổi tối"; pZh = "晚上好"; icon = "🌙"; }

        document.getElementById('welcomeText').innerText = currentLang === 'vi' 
            ? `Chào ${pVi} ngày ${d} tháng ${m}` 
            : `${pZh} ${m}月${d}日`;
        document.getElementById('welcomeIcon').innerText = icon;

        // Xử lý Lễ hội (Ưu tiên cao hơn thời tiết)
        let eventVi = "", eventZh = "";
        if (d==14 && m==2) { activeEmojis = ['💖', '🌹', '🥰']; eventVi = "Chúc mừng Valentine!"; eventZh = "情人节快乐！"; }
        else if (d==8 && m==3) { activeEmojis = ['💐', '🌸', '👩']; eventVi = "Mừng ngày Quốc tế Phụ nữ!"; eventZh = "妇女节快乐！"; }
        else if (d==31 && m==10) { activeEmojis = ['🎃', '👻', '🦇']; eventVi = "Chúc mừng Halloween!"; eventZh = "万圣节快乐！"; }
        else if ((d==24 || d==25) && m==12) { activeEmojis = ['🎄', '🎅', '❄️']; eventVi = "Chúc mừng Giáng sinh!"; eventZh = "圣诞节快乐！"; }
        else if (d==1 && m==1) { activeEmojis = ['🎆', '🎉', '✨']; eventVi = "Chúc mừng Năm mới!"; eventZh = "新年快乐！"; }

        if (eventVi) {
            const evEl = document.getElementById('welcomeEvent');
            evEl.innerText = currentLang === 'vi' ? eventVi : eventZh;
            evEl.style.display = 'block';
            startParticles(); // Start with event emojis
        } else {
            // Lấy thời tiết thực tế nếu không có sự kiện
            fetchWeather();
        }

        setTimeout(() => {
            document.getElementById('welcomeOverlay').classList.add('hidden');
            const items = document.querySelectorAll('#page-home .stagger-item');
            items.forEach((item, idx) => { item.style.animationDelay = `${idx * 0.12}s`; item.classList.add('show'); });
            setTimeout(() => { if(chartInstance) updateUI(); }, 300);
        }, 2500);
    }

    async function fetchWeather() {
        try {
            // Dùng API miễn phí Open-Meteo cho Hà Nội (có thể nâng cấp lấy định vị người dùng)
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=21.0285&longitude=105.8542&current_weather=true`);
            const data = await res.json();
            const code = data.current_weather.weathercode;

            if(code === 0 || code === 1) activeEmojis = ['☀️', '✨', '🌻']; // Nắng đẹp
            else if(code >= 51 && code <= 67) activeEmojis = ['💧', '🌧️', '💦']; // Mưa
            else if(code >= 71 && code <= 86) activeEmojis = ['❄️', '⛄', '🌨️']; // Tuyết
            else if(code >= 95) activeEmojis = ['⚡', '🌩️']; // Sấm chớp
            else if(code >= 2 && code <= 3) activeEmojis = ['☁️', '🫧']; // Mây/Âm u
            
            startParticles();
        } catch(e) {
            startParticles(); // Chạy default nếu lỗi mạng
        }
    }

    function startParticles() {
        resizeCanvas();
        particles = [];
        const particleCount = Math.min(window.innerWidth / 15, 40); // Tối ưu hiệu năng
        for(let i=0; i<particleCount; i++) {
            particles.push(new Particle(activeEmojis[Math.floor(Math.random() * activeEmojis.length)]));
        }
        animatePhysics();
    }

    // --- APP LOGIC ---
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        setTimeout(() => { document.getElementById(pageId).classList.add('active'); }, 10);
        if (pageId === 'page-home') updateUI();
        if (pageId === 'page-list') renderVocabList();
    }

    function updateUI() {
        const total = vocabList.length;
        const learned = vocabList.filter(v => v.status === 'learned').length;
        const unlearned = vocabList.filter(v => v.seenCount > 0 && v.status !== 'learned').length;
        const unseen = vocabList.filter(v => !v.seenCount || v.seenCount === 0).length;
        
        document.getElementById('totalCount').innerText = total;
        document.getElementById('learnedCount').innerText = learned;
        document.getElementById('unlearnedCount').innerText = unlearned;
        document.getElementById('unseenCount').innerText = unseen;
        document.getElementById('todayCountBadge').innerText = vocabList.filter(v => v.dateAdded === getTodayKey()).length;
        
        const percent = total > 0 ? Math.round(((total - unseen) / total) * 100) : 0;
        document.getElementById('chartPercent').innerText = `${percent}%`;

        if (!chartInstance) {
            const ctx = document.getElementById('vocabChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Đã thuộc', 'Chưa thuộc', 'Chưa xem'], datasets: [{ data: [learned, unlearned, unseen], backgroundColor: ['#34c759', '#ff3b30', '#e5e5ea'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '72%', plugins: { legend: { display: false } } }
            });
        } else {
            chartInstance.data.datasets[0].data = [learned, unlearned, unseen];
            chartInstance.update();
        }
    }

    function autoPinyin() {
        const input = document.getElementById('hanziInput').value.trim();
        document.getElementById('pinyinInput').value = input ? pinyin(input, { toneType: 'symbol' }) : '';
    }

    function addOrUpdateWord() {
        const hanzi = document.getElementById('hanziInput').value.trim();
        const py = document.getElementById('pinyinInput').value.trim();
        const meaning = document.getElementById('meaningInput').value.trim();
        const example = document.getElementById('exampleInput').value.trim();

        if (!hanzi || !meaning) return alert('Vui lòng nhập Chữ Hán và Nghĩa!');
        vocabList.push({ id: Date.now(), hanzi, pinyin: py, meaning, example, status: 'unlearned', seenCount: 0, dateAdded: getTodayKey() });
        localStorage.setItem('my_infinite_vocab', JSON.stringify(vocabList));
        
        document.getElementById('hanziInput').value = '';
        document.getElementById('meaningInput').value = '';
        document.getElementById('exampleInput').value = '';
        autoPinyin(); updateUI(); alert('Thêm thành công!');
    }

    function startStudy(filter) {
        showPage('page-flashcard');
        loadNextCard();
    }

    function loadNextCard() {
        let pool = vocabList;
        if (pool.length === 0) {
            document.getElementById('displayHanzi').innerText = 'Hết từ!';
            currentCardIndex = -1; return;
        }
        const selected = pool[Math.floor(Math.random() * pool.length)];
        currentCardIndex = vocabList.findIndex(v => v.id === selected.id);

        document.getElementById('cardDetails').classList.remove('show');
        document.getElementById('displayHanzi').innerText = selected.hanzi;
        document.getElementById('displayPinyin').innerText = selected.pinyin;
        document.getElementById('displayMeaning').innerText = selected.meaning;
        
        if (selected.example) {
            document.getElementById('displayExampleText').innerText = selected.example;
            document.getElementById('displayExampleBox').style.display = 'block';
        } else {
            document.getElementById('displayExampleBox').style.display = 'none';
        }

        if(autoSpeechEnabled && window.speechSynthesis) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(selected.hanzi);
            u.lang = 'zh-CN'; window.speechSynthesis.speak(u);
        }
    }

    function markCard(isLearned) {
        if (currentCardIndex === -1) return;
        vocabList[currentCardIndex].status = isLearned ? 'learned' : 'unlearned';
        vocabList[currentCardIndex].seenCount++;
        localStorage.setItem('my_infinite_vocab', JSON.stringify(vocabList));
        loadNextCard();
    }

    document.getElementById('flashcard').addEventListener('click', function() {
        const details = document.getElementById('cardDetails');
        details.classList.toggle('show');
    });

    function renderVocabList() {
        const container = document.getElementById('vocabListContainer');
        container.innerHTML = '';
        vocabList.forEach(item => {
            const div = document.createElement('div'); div.className = 'vocab-item physical-obstacle';
            let exHtml = item.example ? `<div class="vocab-item-eg">${item.example}</div>` : '';
            div.innerHTML = `<div class="vocab-item-left"><div class="vocab-item-hanzi">${item.hanzi} <span style="font-size:14px; color:var(--danger);">${item.pinyin}</span></div><div class="vocab-item-sub">${item.meaning}</div>${exHtml}</div>`;
            container.appendChild(div);
        });
        document.getElementById('listTotalCount').innerText = vocabList.length;
    }

    window.onload = function() {
        initWeatherAndEvents();
    };
</script>
</body>
</html>
