<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="app_title">Ôn Tập Tiếng Trung</title>
    <script src="https://unpkg.com/pinyin-pro"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #007aff; --success: #34c759; --danger: #ff3b30; --warning: #ff9500; --bg-system: #f2f2f7; --card-bg: #ffffff; --text-main: #1c1c1e; --text-sub: #8e8e93; --border: #e5e5ea; --input-bg: #fafafa; --item-bg: #f2f2f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: background-color 0.4s, color 0.4s; touch-action: manipulation; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background-color: var(--bg-system); color: var(--text-main); margin: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px) 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .sync-status { position: absolute; top: 12px; right: 16px; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 10px; background: rgba(52,199,89,0.15); color: var(--success); }
        .sync-status.off { background: rgba(255,59,48,0.15); color: var(--danger); }
        .iphone-container { width: 100%; max-width: 414px; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .card-box { background: var(--card-bg); border-radius: 18px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border: 1px solid var(--border); position: relative; }
        .page { display: none; width: 100%; }
        .page.active { display: flex; flex-direction: column; gap: 16px; }
        .page-title { font-size: 20px; font-weight: 700; text-align: center; margin: 0 0 4px 0; color: var(--text-main); }
        button, .btn-menu { cursor: pointer; user-select: none; border-radius: 14px; border: none; padding: 14px; font-size: 16px; font-weight: 600; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-menu { background: var(--card-bg); color: var(--text-main); text-align: left; padding: 16px 18px; border: 1px solid var(--border); display: flex; justify-content: space-between; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; text-align: center; }
        .stat-item { background: var(--item-bg); padding: 8px 2px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-number { font-size: 17px; font-weight: 700; }
        .stat-label { font-size: 10px; color: var(--text-sub); margin-top: 2px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
        .input-group input, .input-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 16px; background: var(--input-bg); outline: none; }
        .flashcard { width: 100%; min-height: 320px; background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border); padding: 30px 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hanzi-display { font-size: 56px; font-weight: 700; }
        .btn-know { background: rgba(52,199,89,0.15); color: var(--success); flex: 1; }
        .btn-unknow { background: rgba(255,59,48,0.15); color: var(--danger); flex: 1; }
        .action-btns { display: flex; gap: 12px; width: 100%; }
        .vocab-item { background: var(--item-bg); padding: 12px 14px; border-radius: 12px; display: flex; justify-content: space-between; border: 1px solid var(--border); margin-bottom: 8px; }
        .btn-back { background: var(--item-bg); color: var(--primary); margin-bottom: 4px; padding: 12px; }
    </style>
</head>
<body>

<div class="iphone-container">
    <div id="page-home" class="page active">
        <h2 class="page-title">Ôn Tập Tiếng Trung</h2>
        <div class="card-box">
            <div class="sync-status" id="syncBadge">☁️ Đang kết nối...</div>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Tổng từ</div></div>
                <div class="stat-item"><div class="stat-number" id="learnedCount" style="color: var(--success);">0</div><div class="stat-label">Đã thuộc</div></div>
                <div class="stat-item"><div class="stat-number" id="unlearnedCount" style="color: var(--danger);">0</div><div class="stat-label">Cần ôn</div></div>
                <div class="stat-item"><div class="stat-number" id="unseenCount" style="color: #8e8e93;">0</div><div class="stat-label">Chưa xem</div></div>
            </div>
        </div>

        <button class="btn-primary" onclick="showPage('page-flashcard'); loadNextCard();">🚀 Bắt Đầu Ôn Tập</button>
        <button class="btn-menu" onclick="showPage('page-add')"><span>➕ Thêm Từ Vựng Mới</span> <span>➔</span></button>
        <button class="btn-menu" onclick="showPage('page-list'); renderVocabList();"><span>📋 Danh Sách Từ Vựng</span> <span>➔</span></button>
        
        <div style="display:flex; gap:8px;">
            <button style="flex:1; background:var(--item-bg); color:var(--primary); font-size:13px;" onclick="exportData()">📥 Tải sao lưu</button>
            <button style="flex:1; background:var(--item-bg); color:var(--primary); font-size:13px;" onclick="document.getElementById('importFile').click()">📤 Khôi phục</button>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
        </div>
    </div>

    <div id="page-add" class="page">
        <button class="btn-back" onclick="showPage('page-home')">⬅ Quay về ban đầu</button>
        <div class="card-box">
            <h3>Thêm Từ Vựng Mới</h3>
            <div class="input-group"><label>Chữ Hán:</label><input type="text" id="hanziInput" oninput="autoPinyin()"></div>
            <div class="input-group"><label>Bính âm (Pinyin):</label><input type="text" id="pinyinInput" readonly></div>
            <div class="input-group"><label>Nghĩa Tiếng Việt:</label><input type="text" id="meaningInput"></div>
            <div class="input-group"><label>Ví dụ (Tùy chọn):</label><textarea id="exampleInput"></textarea></div>
            <button class="btn-primary" onclick="addWord()">Lưu Từ Vựng</button>
        </div>
    </div>

    <div id="page-list" class="page">
        <button class="btn-back" onclick="showPage('page-home')">⬅ Quay về ban đầu</button>
        <div class="card-box">
            <h3>Danh Sách Từ Vựng</h3>
            <div id="vocabListContainer"></div>
        </div>
    </div>

    <div id="page-flashcard" class="page">
        <button class="btn-back" onclick="showPage('page-home')">⬅ Quay về ban đầu</button>
        <div class="flashcard" id="flashcard" onclick="toggleDetails()">
            <div class="hanzi-display" id="displayHanzi">Vui lòng thêm từ</div>
            <div id="cardDetails" style="display:none; margin-top: 12px;">
                <div style="font-size: 24px; color: var(--danger); font-weight: 700;" id="displayPinyin"></div>
                <div style="font-size: 18px; font-weight: 600;" id="displayMeaning"></div>
            </div>
        </div>
        <div class="action-btns">
            <button class="btn-know" onclick="markCard(true)">👈 Đã thuộc</button>
            <button class="btn-unknow" onclick="markCard(false)">Chưa thuộc 👉</button>
        </div>
    </div>
</div>

<script>
    const { pinyin } = pinyinPro;

    const firebaseConfig = {
        apiKey: "AIzaSyBEvxSII35LuSpWZkqZ5zspeLPaFWB-sfQ",
        authDomain: "tuvungtiengtrung-c03b1.firebaseapp.com",
        databaseURL: "https://tuvungtiengtrung-c03b1-default-rtdb.firebaseio.com",
        projectId: "tuvungtiengtrung-c03b1",
        storageBucket: "tuvungtiengtrung-c03b1.firebasestorage.app",
        messagingSenderId: "1035757019013",
        appId: "1:1035757019013:web:cbc94f7c167529a7d5aeec"
    };

    let db = null;
    let vocabList = JSON.parse(localStorage.getItem('my_infinite_vocab')) || [];
    let currentCardIndex = -1;

    function initFirebase() {
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            
            db.ref('app_vocab_data').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.vocab) {
                    vocabList = data.vocab;
                    localStorage.setItem('my_infinite_vocab', JSON.stringify(vocabList));
                    updateUI();
                    if (document.getElementById('page-list').classList.contains('active')) renderVocabList();
                }
            });
            document.getElementById('syncBadge').innerText = "☁️ Đã kết nối Cloud";
            document.getElementById('syncBadge').classList.remove('off');
        } catch (e) {
            document.getElementById('syncBadge').innerText = "💾 Bộ nhớ máy (Offline)";
            document.getElementById('syncBadge').classList.add('off');
        }
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id === 'page-home') updateUI();
    }

    function autoPinyin() {
        const val = document.getElementById('hanziInput').value.trim();
        document.getElementById('pinyinInput').value = val ? pinyin(val, { toneType: 'symbol' }) : '';
    }

    function addWord() {
        const hz = document.getElementById('hanziInput').value.trim();
        const py = document.getElementById('pinyinInput').value.trim();
        const mn = document.getElementById('meaningInput').value.trim();
        const eg = document.getElementById('exampleInput').value.trim();
        if (!hz || !mn) return alert('Nhập chữ Hán và Nghĩa!');
        
        vocabList.push({ id: Date.now(), hanzi: hz, pinyin: py, meaning: mn, example: eg, learned: false, seen: false });
        saveData();
        document.getElementById('hanziInput').value = '';
        document.getElementById('meaningInput').value = '';
        document.getElementById('exampleInput').value = '';
        alert('Đã thêm từ!');
        showPage('page-home');
    }

    function saveData() {
        localStorage.setItem('my_infinite_vocab', JSON.stringify(vocabList));
        if (db) {
            db.ref('app_vocab_data').set({ vocab: vocabList, updatedAt: Date.now() });
        }
    }

    function updateUI() {
        const tot = vocabList.length;
        const lr = vocabList.filter(v => v.learned).length;
        const ulr = vocabList.filter(v => v.seen && !v.learned).length;
        const usn = vocabList.filter(v => !v.seen).length;

        document.getElementById('totalCount').innerText = tot;
        document.getElementById('learnedCount').innerText = lr;
        document.getElementById('unlearnedCount').innerText = ulr;
        document.getElementById('unseenCount').innerText = usn;
    }

    function renderVocabList() {
        const c = document.getElementById('vocabListContainer');
        c.innerHTML = '';
        if (vocabList.length === 0) { c.innerHTML = '<div style="text-align:center; color:var(--text-sub);">Chưa có từ nào</div>'; return; }
        vocabList.forEach(item => {
            c.innerHTML += `<div class="vocab-item"><div><b>${item.hanzi}</b> (${item.pinyin})<br><small>${item.meaning}</small></div><button onclick="deleteWord(${item.id})" style="padding:4px 8px; font-size:12px; background:rgba(255,59,48,0.1); color:var(--danger);">Xóa</button></div>`;
        });
    }

    function deleteWord(id) {
        vocabList = vocabList.filter(v => v.id !== id);
        saveData();
        renderVocabList();
    }

    function loadNextCard() {
        if (vocabList.length === 0) {
            document.getElementById('displayHanzi').innerText = "Hết từ ôn tập";
            document.getElementById('cardDetails').style.display = 'none';
            currentCardIndex = -1;
            return;
        }
        currentCardIndex = Math.floor(Math.random() * vocabList.length);
        const item = vocabList[currentCardIndex];
        document.getElementById('displayHanzi').innerText = item.hanzi;
        document.getElementById('displayPinyin').innerText = item.pinyin;
        document.getElementById('displayMeaning').innerText = item.meaning;
        document.getElementById('cardDetails').style.display = 'none';
    }

    function toggleDetails() {
        const d = document.getElementById('cardDetails');
        d.style.display = d.style.display === 'none' ? 'block' : 'none';
    }

    function markCard(isLearned) {
        if (currentCardIndex === -1 || !vocabList[currentCardIndex]) return;
        vocabList[currentCardIndex].seen = true;
        vocabList[currentCardIndex].learned = isLearned;
        saveData();
        loadNextCard();
    }

    function exportData() {
        const b = { vocab: vocabList };
        const a = document.createElement('a');
        a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(b));
        a.download = `TuVung_Backup.json`;
        a.click();
    }

    function importData(e) {
        const r = new FileReader();
        r.onload = function(ev) {
            try {
                const imp = JSON.parse(ev.target.result);
                if (imp.vocab) vocabList = imp.vocab;
                saveData();
                alert('Khôi phục thành công!');
                location.reload();
            } catch (err) { alert('Lỗi file!'); }
        };
        r.readAsText(e.target.files[0]);
    }

    window.onload = function() { updateUI(); initFirebase(); };
</script>
</body>
</html>
