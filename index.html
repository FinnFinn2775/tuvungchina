<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flashcard Tiếng Trung</title>
    <!-- Thư viện Pinyin -->
    <script src="https://unpkg.com/pinyin-pro"></script>
    <!-- Thư viện Biểu đồ Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --danger: #ff3b30;
            --bg-system: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-sub: #8e8e93;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-system);
            color: var(--text-main);
            margin: 0;
            padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px) 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .iphone-container { width: 100%; max-width: 414px; display: flex; flex-direction: column; gap: 16px; }

        .card-box {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        /* Thống kê */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; text-align: center; }
        .stat-item { background: var(--bg-system); padding: 8px 4px; border-radius: 12px; }
        .stat-number { font-size: 18px; font-weight: 700; }
        .chart-wrapper { position: relative; width: 140px; height: 140px; margin: 0 auto; }

        /* Nút bấm iOS */
        button { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.15s ease; }
        button:active { opacity: 0.7; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-back { background: #e5e5ea; color: var(--text-main); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }

        .menu-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }

        /* Form Nhập */
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 4px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #c7c7cc; border-radius: 10px; font-size: 16px; background: #fafafa; outline: none; }
        .input-group input:focus { border-color: var(--primary); background: #fff; }
        .input-group input[readonly] { background-color: #e5e5ea; color: #3a3a3c; }

        /* Flashcard Swipe Area */
        .swipe-container { position: relative; width: 100%; height: 270px; perspective: 1000px; margin-bottom: 12px; }
        .flashcard { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.4s ease, left 0.3s ease, opacity 0.3s ease; cursor: pointer; user-select: none; }
        .flashcard.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 22px; background: var(--card-bg); box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border: 1px solid #e5e5ea; padding: 20px; text-align: center; box-sizing: border-box;
        }

        .front { font-size: 52px; font-weight: 700; color: var(--text-main); }
        .back { transform: rotateY(180deg); background: #fdfdfd; }
        .pinyin-text { font-size: 24px; color: var(--danger); font-weight: 600; margin-bottom: 8px; }
        .meaning-text { font-size: 18px; color: var(--text-main); }
        .seen-badge { position: absolute; top: 14px; right: 16px; font-size: 12px; color: var(--text-sub); }

        /* Tools trên Thẻ */
        .card-tools { position: absolute; top: 12px; left: 16px; display: flex; gap: 8px; z-index: 10; }
        .btn-tool { width: auto; padding: 4px 8px; font-size: 12px; border-radius: 6px; }
        .btn-edit { background: #e5e5ea; color: var(--primary); }
        .btn-delete { background: #ffe5e5; color: var(--danger); }

        .action-btns { display: flex; gap: 10px; }
        .btn-know { background: #e4f9e8; color: var(--success); }
        .btn-unknow { background: #ffe5e5; color: var(--danger); }
        .hint-swipe { text-align: center; font-size: 12px; color: var(--text-sub); margin-bottom: 8px; }

        /* Quản lý các Màn hình */
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body>

<div class="iphone-container">

    <!-- MÀN HÌNH CHÍNH (HOME) -->
    <div id="homeView" class="view-section active">
        <div class="card-box">
            <h3 style="margin: 0 0 12px 0; font-size: 17px; text-align: center;">Thống Kê Từ Vựng</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">0</div>
                    <div style="font-size: 11px; color: var(--text-sub);">Tổng từ</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="learnedCount" style="color: var(--success);">0</div>
                    <div style="font-size: 11px; color: var(--text-sub);">Đã thuộc</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="unlearnedCount" style="color: var(--danger);">0</div>
                    <div style="font-size: 11px; color: var(--text-sub);">Chưa thuộc</div>
                </div>
            </div>
            <div class="chart-wrapper"><canvas id="vocabChart"></canvas></div>
        </div>

        <div class="menu-buttons">
            <button class="btn-primary" onclick="showView('addWordView')">➕ Thêm Từ Vựng Mới</button>
            <button class="btn-success" onclick="startReview('all')">📖 Ôn Tập Tất Cả Từ</button>
            <button class="btn-danger" onclick="startReview('unlearned')">🎯 Chỉ Ôn Từ CHƯA THUỘC</button>
        </div>
    </div>

    <!-- MÀN HÌNH THÊM / SỬA TỪ -->
    <div id="addWordView" class="view-section">
        <button class="btn-back" onclick="showView('homeView')">⬅ Quay về màn hình chính</button>
        <div class="card-box">
            <h3 style="margin: 0 0 12px 0; font-size: 17px;" id="formTitle">Thêm Từ Vựng Mới</h3>
            <div class="input-group">
                <label>Chữ Hán:</label>
                <input type="text" id="hanziInput" placeholder="Nhập chữ Hán..." oninput="autoPinyin()">
            </div>
            <div class="input-group">
                <label>Bính âm (Pinyin):</label>
                <input type="text" id="pinyinInput" readonly placeholder="Tự động hiện Pinyin">
            </div>
            <div class="input-group">
                <label>Nghĩa Tiếng Việt:</label>
                <input type="text" id="meaningInput" placeholder="Nhập nghĩa...">
            </div>
            <button class="btn-primary" id="saveBtn" onclick="addOrUpdateWord()">Lưu Từ Vựng</button>
            <button class="btn-back" id="cancelEditBtn" onclick="resetForm()" style="display:none; margin-top:8px;">Hủy Chỉnh Sửa</button>
        </div>
    </div>

    <!-- MÀN HÌNH ÔN TẬP FLASHCARD -->
    <div id="reviewView" class="view-section">
        <button class="btn-back" onclick="showView('homeView')">⬅ Quay về màn hình chính</button>
        
        <div class="hint-swipe">👈 Vuốt Trái: Đã thuộc | Vuốt Phải: Chưa thuộc 👉</div>
        <div class="swipe-container">
            <div class="flashcard" id="flashcard">
                <div class="card-face front">
                    <div class="card-tools" onclick="event.stopPropagation()">
                        <button class="btn-tool btn-edit" onclick="editCurrentCard()">✏️ Sửa</button>
                        <button class="btn-tool btn-delete" onclick="deleteCurrentCard()">🗑️ Xóa</button>
                    </div>
                    <span class="seen-badge" id="seenCount">Hiện: 0</span>
                    <span id="displayHanzi">Vui lòng thêm từ</span>
                </div>
                <div class="card-face back">
                    <div class="card-tools" onclick="event.stopPropagation()">
                        <button class="btn-tool btn-edit" onclick="editCurrentCard()">✏️ Sửa</button>
                        <button class="btn-tool btn-delete" onclick="deleteCurrentCard()">🗑️ Xóa</button>
                    </div>
                    <div class="pinyin-text" id="displayPinyin"></div>
                    <div class="meaning-text" id="displayMeaning"></div>
                </div>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn-know" onclick="markCard(true)">👈 Đã thuộc</button>
            <button class="btn-unknow" onclick="markCard(false)">Chưa thuộc 👉</button>
        </div>
    </div>

</div>

<script>
    const { pinyin } = pinyinPro;

    let vocabList = JSON.parse(localStorage.getItem('my_infinite_vocab')) || [];
    let currentFilter = 'all';
    let currentCardIndex = -1;
    let editingId = null;
    let chartInstance = null;

    // Chuyển đổi qua lại giữa các Màn hình
    function showView(viewId) {
        document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if (viewId === 'homeView') {
            updateUI();
        }
    }

    function autoPinyin() {
        const input = document.getElementById('hanziInput').value.trim();
        if (input) {
            document.getElementById('pinyinInput').value = pinyin(input, { toneType: 'symbol' });
        } else {
            document.getElementById('pinyinInput').value = '';
        }
    }

    function initChart() {
        const ctx = document.getElementById('vocabChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Đã thuộc', 'Chưa thuộc'],
                datasets: [{ data: [0, 0], backgroundColor: ['#34c759', '#ff3b30'], borderWidth: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }

    function addOrUpdateWord() {
        const hanzi = document.getElementById('hanziInput').value.trim();
        const py = document.getElementById('pinyinInput').value.trim();
        const meaning = document.getElementById('meaningInput').value.trim();

        if (!hanzi || !meaning) {
            alert('Vui lòng nhập Chữ Hán và Nghĩa!');
            return;
        }

        if (editingId) {
            const idx = vocabList.findIndex(v => v.id === editingId);
            if (idx !== -1) {
                vocabList[idx].hanzi = hanzi;
                vocabList[idx].pinyin = py;
                vocabList[idx].meaning = meaning;
            }
        } else {
            vocabList.push({
                id: Date.now(), hanzi: hanzi, pinyin: py, meaning: meaning, status: 'unlearned', seenCount: 0
            });
        }

        saveData();
        resetForm();
        alert('Đã lưu thành công!');
        showView('homeView');
    }

    function editCurrentCard() {
        if (currentCardIndex === -1 || vocabList.length === 0) return;
        const item = vocabList[currentCardIndex];
        editingId = item.id;
        document.getElementById('hanziInput').value = item.hanzi;
        document.getElementById('pinyinInput').value = item.pinyin;
        document.getElementById('meaningInput').value = item.meaning;

        document.getElementById('formTitle').innerText = "Sửa Từ Vựng";
        document.getElementById('saveBtn').innerText = "Cập Nhật Từ";
        document.getElementById('cancelEditBtn').style.display = "block";
        
        showView('addWordView');
    }

    function deleteCurrentCard() {
        if (currentCardIndex === -1 || vocabList.length === 0) return;
        if (confirm("Bạn có chắc chắn muốn xóa từ này khỏi danh sách?")) {
            vocabList.splice(currentCardIndex, 1);
            saveData();
            loadNextCard();
        }
    }

    function resetForm() {
        editingId = null;
        document.getElementById('hanziInput').value = '';
        document.getElementById('pinyinInput').value = '';
        document.getElementById('meaningInput').value = '';
        document.getElementById('formTitle').innerText = "Thêm Từ Vựng Mới";
        document.getElementById('saveBtn').innerText = "Lưu Từ Vựng";
        document.getElementById('cancelEditBtn').style.display = "none";
    }

    function saveData() { localStorage.setItem('my_infinite_vocab', JSON.stringify(vocabList)); }

    function updateUI() {
        const total = vocabList.length;
        const learned = vocabList.filter(v => v.status === 'learned').length;
        const unlearned = total - learned;

        document.getElementById('totalCount').innerText = total;
        document.getElementById('learnedCount').innerText = learned;
        document.getElementById('unlearnedCount').innerText = unlearned;

        if (chartInstance) {
            chartInstance.data.datasets[0].data = [learned, unlearned];
            chartInstance.update();
        }
    }

    function startReview(filter) {
        currentFilter = filter;
        loadNextCard();
        showView('reviewView');
    }

    function loadNextCard() {
        let pool = vocabList;
        if (currentFilter === 'unlearned') {
            pool = vocabList.filter(v => v.status === 'unlearned');
        }

        const cardElem = document.getElementById('flashcard');
        cardElem.classList.remove('flipped');

        if (pool.length === 0) {
            document.getElementById('displayHanzi').innerText = "Hết từ ôn!";
            document.getElementById('displayPinyin').innerText = "";
            document.getElementById('displayMeaning').innerText = "";
            document.getElementById('seenCount').innerText = "";
            currentCardIndex = -1;
            return;
        }

        pool.sort((a, b) => a.seenCount - b.seenCount);
        const minSeen = pool[0].seenCount;
        const candidatePool = pool.filter(v => v.seenCount === minSeen);

        const selected = candidatePool[Math.floor(Math.random() * candidatePool.length)];
        currentCardIndex = vocabList.findIndex(v => v.id === selected.id);

        document.getElementById('displayHanzi').innerText = selected.hanzi;
        document.getElementById('displayPinyin').innerText = selected.pinyin;
        document.getElementById('displayMeaning').innerText = selected.meaning;
        document.getElementById('seenCount').innerText = `Hiện: ${selected.seenCount}`;
    }

    function markCard(isLearned) {
        if (currentCardIndex === -1 || vocabList.length === 0) return;

        const item = vocabList[currentCardIndex];
        item.status = isLearned ? 'learned' : 'unlearned';
        item.seenCount += 1;

        saveData();

        const cardElem = document.getElementById('flashcard');
        cardElem.style.transform = isLearned ? 'translateX(-120%) rotate(-10deg)' : 'translateX(120%) rotate(10deg)';
        cardElem.style.opacity = '0';

        setTimeout(() => {
            cardElem.style.transform = '';
            cardElem.style.opacity = '1';
            loadNextCard();
        }, 300);
    }

    document.getElementById('flashcard').addEventListener('click', function() {
        this.classList.toggle('flipped');
    });

    let startX = 0;
    const cardElem = document.getElementById('flashcard');
    cardElem.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
    cardElem.addEventListener('touchend', e => {
        let diffX = e.changedTouches[0].clientX - startX;
        if (diffX < -50) markCard(true);
        if (diffX > 50) markCard(false);
    });

    window.onload = function() {
        initChart();
        updateUI();
    };
</script>

</body>
</html>
