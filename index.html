<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flashcard Tiếng Trung - iPhone 11 Pro Max</title>
    <!-- Thư viện Pinyin -->
    <script src="https://unpkg.com/pinyin-pro"></script>
    <!-- Thư viện Biểu đồ tròn Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --danger: #ff3b30;
            --warning: #ff9500;
            --bg-system: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-sub: #8e8e93;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-system);
            color: var(--text-main);
            margin: 0;
            padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px) 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Khung hiển thị chuẩn kích thước iPhone 11 Pro Max */
        .iphone-container {
            width: 100%;
            max-width: 414px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-box {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        /* Thống kê */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            text-align: center;
        }

        .stat-item {
            background: var(--bg-system);
            padding: 8px 4px;
            border-radius: 12px;
        }

        .stat-number {
            font-size: 18px;
            font-weight: 700;
        }

        .chart-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto;
        }

        /* Form Nhập */
        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #c7c7cc;
            border-radius: 10px;
            font-size: 16px;
            background: #fafafa;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: #fff;
        }

        .input-group input[readonly] {
            background-color: #e5e5ea;
            color: #3a3a3c;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        button:active { opacity: 0.7; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-filter-group { display: flex; gap: 8px; }
        .btn-filter { background: #e5e5ea; color: var(--text-main); font-size: 14px; padding: 10px; }
        .btn-filter.active { background: var(--primary); color: white; }

        /* Flashcard Swipe Area */
        .swipe-container {
            position: relative;
            width: 100%;
            height: 260px;
            perspective: 1000px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.4s ease, left 0.3s ease, opacity 0.3s ease;
            cursor: pointer;
            user-select: none;
        }

        .flashcard.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 22px;
            background: var(--card-bg);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border: 1px solid #e5e5ea;
            padding: 20px;
            text-align: center;
        }

        .front { font-size: 52px; font-weight: 700; color: var(--text-main); }
        .back { transform: rotateY(180deg); background: #fdfdfd; }

        .pinyin-text { font-size: 24px; color: var(--danger); font-weight: 600; margin-bottom: 6px; }
        .hanviet-text { font-size: 18px; color: var(--warning); font-weight: 600; margin-bottom: 6px; }
        .meaning-text { font-size: 18px; color: var(--text-main); }
        .seen-badge { position: absolute; top: 14px; right: 16px; font-size: 12px; color: var(--text-sub); }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-know { background: #e4f9e8; color: var(--success); }
        .btn-unknow { background: #ffe5e5; color: var(--danger); }
        .hint-swipe { text-align: center; font-size: 12px; color: var(--text-sub); }
    </style>
</head>
<body>

<div class="iphone-container">

    <!-- BẢNG THỐNG KÊ BIỂU ĐỒ TRÒN -->
    <div class="card-box">
        <h3 style="margin: 0 0 12px 0; font-size: 17px; text-align: center;">Thống Kê Từ Vựng</h3>
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-number" id="totalCount">0</div>
                <div style="font-size: 11px; color: var(--text-sub);">Tổng từ</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="learnedCount" style="color: var(--success);">0</div>
                <div style="font-size: 11px; color: var(--text-sub);">Đã thuộc</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="unlearnedCount" style="color: var(--danger);">0</div>
                <div style="font-size: 11px; color: var(--text-sub);">Chưa thuộc</div>
            </div>
        </div>
        <div class="chart-wrapper">
            <canvas id="vocabChart"></canvas>
        </div>
    </div>

    <!-- FORM THÊM TỪ -->
    <div class="card-box">
        <h3 style="margin: 0 0 12px 0; font-size: 17px;">Thêm Từ Vựng Mới</h3>
        <div class="input-group">
            <label>Chữ Hán:</label>
            <input type="text" id="hanziInput" placeholder="Nhập chữ Hán..." oninput="autoProcessHanzi()">
        </div>
        <div class="input-group">
            <label>Bính âm (Pinyin):</label>
            <input type="text" id="pinyinInput" readonly placeholder="Tự động hiện Pinyin">
        </div>
        <div class="input-group">
            <label>Âm Hán Việt (Tự động):</label>
            <input type="text" id="hanvietInput" placeholder="Tự động hiện Hán Việt">
        </div>
        <div class="input-group">
            <label>Nghĩa Tiếng Việt:</label>
            <input type="text" id="meaningInput" placeholder="Nhập nghĩa giải thích...">
        </div>
        <button class="btn-primary" onclick="addWord()">Lưu Từ Vựng</button>
    </div>

    <!-- BỘ LỌC ÔN TẬP -->
    <div class="btn-filter-group">
        <button class="btn-filter active" id="filterAllBtn" onclick="setFilter('all')">Ôn Tất Cả Từ</button>
        <button class="btn-filter" id="filterUnlearnedBtn" onclick="setFilter('unlearned')">Chỉ Ôn CHƯA THUỘC</button>
    </div>

    <!-- KHU VỰC THẺ FLASHCARD SWIPE -->
    <div class="hint-swipe">👈 Vuốt Trái: Đã thuộc | Vuốt Phải: Chưa thuộc 👉</div>
    <div class="swipe-container">
        <div class="flashcard" id="flashcard">
            <div class="card-face front">
                <span class="seen-badge" id="seenCount">Hiện: 0</span>
                <span id="displayHanzi">Vui lòng thêm từ</span>
            </div>
            <div class="card-face back">
                <div class="pinyin-text" id="displayPinyin"></div>
                <div class="hanviet-text" id="displayHanViet"></div>
                <div class="meaning-text" id="displayMeaning"></div>
            </div>
        </div>
    </div>

    <div class="action-btns">
        <button class="btn-know" onclick="markCard(true)">👈 Đã thuộc</button>
        <button class="btn-unknow" onclick="markCard(false)">Chưa thuộc 👉</button>
    </div>

</div>

<script>
    const { pinyin } = pinyinPro;

    // Từ điển Hán Việt tích hợp mở rộng
    const hanVietDict = {
        '一':'Nhất','七':'Thất','三':'Tam','上':'Thượng','下':'Hạ','不':'Bất','与':'Dữ','丑':'Sửu','专':'Chuyên','且':'Thả',
        '世':'Thế','丘':'Khâu','丙':'Bính','业':'Nghệp','丛':'Tùng','东':'Đông','丝':'Ti','丞':'Thừa','丢':'Đâu','两':'Lưỡng',
        '严':'Nghiêm','丧':'Táng','个':'Cá','丫':'A','中':'Trung','丰':'Phong','串':'Xuyến','临':'Lâm','丸':'Hoàn','丹':'Đan',
        '为':'Vi','主':'Chủ','丽':'Lệ','举':'Cử','乃':'Nãi','久':'Cửu','么':'Ma','义':'Nghĩa','之':'Chi','乌':'Ô',
        '乍':'Sạ','乎':'Hồ','乏':'Phạt','乐':'Nhạc','乒':'Binh','乓':'Bàng','乔':'Kiều','乖':'Quái','乘':'Thừa','九':'Cửu',
        '也':'Dã','习':'Tập','乡':'Hương','书':'Thư','买':'Mãi','乱':'Loạn','乾':'Càn','了':'Liễu','予':'Dư','争':'Tranh',
        '事':'Sự','二':'Nhị','于':'Vu','亏':'Khuya','云':'Vân','互':'Hỗ','五':'Ngũ','井':'Tỉnh','亚':'Á','些':'Ta',
        '亚':'Á','交':'Giao','亦':'Diệc','产':'Sản','亨':'Hanh','亩':'Mẫu','享':'Hưởng','京':'Kinh','亭':'Đình','亮':'Lượng',
        '亲':'Thân','人':'Nhân','亿':'Ức','什':'Thập','仁':'Nhân','仅':'Cận','仆':'Bộc','仇':'Cừu','今':'Kim','介':'Giới',
        '仍':'Nhược','仓':'Thương','仔':'Tử','仕':'Sĩ','他':'Tha','付':'Phó','仙':'Tiên','代':'Đại','令':'Lệnh','以':'Dĩ',
        '仪':'Nghi','仰':'Ngưỡng','仲':'Trọng','件':'Kiện','价':'Giá','任':'Nhiệm','份':'Phận','仿':'Phỏng','企':'Xí','伊':'Y',
        '伍':'Ngũ','伏':'Phục','伐':'Phạt','休':'Hưu','众':'Chúng','优':'Ưu','伟':'Vĩ','传':'Truyền','伤':'Thương','伦':'Luân',
        '伯':'Bác','估':'Cổ','体':'Thể','何':'Hà','余':'Dư','佛':'Phật','作':'Tác','你':'Nể','佩':'Bội','佳':'Giai',
        '使':'Sử','来':'Lai','例':'Lệ','侍':'Thị','供':'Cung','依':'Y','侠':'Hiệp','侦':'Trinh','侧':'Trắc','侨':'Kiều',
        '侯':'Hầu','侵':'Xâm','便':'Tiện','保':'Bảo','信':'Tín','修':'Tu','俱':'Câu','伟':'Vĩ','健':'Kiện','备':'Bị',
        '傲':'Ngạo','传':'Truyền','倾':'Khuynh','催':'Thôi','伤':'Thương','傻':'Sả','像':'Tượng','僚':'Liêu','僧':'Tăng','仙':'Tiên',
        '元':'Nguyên','兄':'Huynh','充':'Sung','兆':'Triệu','先':'Tiên','光':'Quang','克':'Khắc','免':'Miễn','兑':'Đoái','兔':'Thỏ',
        '党':'Đảng','兜':'Đâu','入':'Nhập','全':'Toàn','八':'Bát','公':'Công','六':'Lục','兰':'Lan','共':'Cộng','关':'Quan',
        '兴':'Hưng','兵':'Binh','其':'Kỳ','具':'Cụ','典':'Điển','兹':'Tư','养':'Dưỡng','兼':'Kiêm','兽':'Thú','内':'Nội',
        '冈':'Cương','册':'Sách','再':'Tái','冒':'Mạo','写':'Tả','军':'Quân','农':'Nông','冠':'Quan','冢':'Trủng','冬':'Đông',
        '冰':'Băng','冲':'Xung','决':'Quyết','况':'Huống','冷':'Lãnh','冻':'Đống','净':'Tịnh','准':'Chuẩn','凉':'Lương','减':'Giảm',
        '凑':'Tấu','凛':'Lẫm','凝':'Ngưng','几':'Kỷ','凡':'Phàm','凤':'Phượng','凭':'Bằng','凯':'Khải','凰':'Hoàng','出':'Xuất',
        '击':'Kích','函':'Hàm','凿':'Tạc','刀':'Đao','切':'Thiết','刊':'San','刑':'Hình','划':'Hoạch','列':'Liệt','刘':'Lưu',
        '则':'Tắc','刚':'Cương','创':'Sáng','初':'Sơ','删':'San','判':'Phán','券':'Khoán','刺':'Thứ','刻':'Khắc','剃':'Thế',
        '削':'Tước','前':'Tiền','剑':'Kiếm','剔':'Dịch','剖':'Phẫu','剥':'Bác','剧':'Kịch','剩':'Thặng','剪':'Tiễn','副':'Phó',
        '割':'Cát','力':'Lực','劝':'Khuyến','办':'Biện','功':'Công','加':'Gia','务':'Vụ','劣':'Liệt','动':'Động','助':'Trợ',
        '努':'Nỗ','劫':'Kiếp','励':'Lệ','劲':'Kính','劳':'Lao','势':'Thế','勇':'Dũng','勉':'Miễn','勋':'Huân','勒':'Lặc',
        '勾':'Câu','勿':'Vật','包':'Bao','匆':'Thốt','匈':'Hung','葡':'Bồ','萄':'Đào','化':'Hóa','北':'Bắc','匙':'Thì',
        '匹':'Thất','区':'Khu','医':'Y','匾':'Biển','十':'Thập','千':'Thiên','升':'Thăng','午':'Ngọ','半':'Bán','华':'Hoa',
        '协':'Hiệp','卑':'Ty','卒':'Tốt','卓':'Trác','单':'Đơn','卖':'Mại','南':'Nam','博':'Bác','卜':'Bốc','卞':'Biện',
        '占':'Chiêm','卡':'Tạp','卢':'Lô','印':'Ấn','危':'Nguy','即':'Tức','却':'Khước','卵':'Noãn','卷':'Quyển','卸':'Há',
        '厂':'Xưởng','厄':'Ách','厅':'Sảnh','历':'Lịch','厉':'Lệ','压':'Áp','厌':'Yếm','厕':'Xí','厚':'Hậu','原':'Nguyên',
        '厢':'Sương','厨':'Trù','去':'Khứ','县':'Huyện','参':'Tham','又':'Hựu','叉':'Xoa','及':'Cập','友':'Hữu','双':'Song',
        '反':'Phản','发':'Phát','叔':'Thúc','取':'Thủ','受':'Thụ','变':'Biến','叙':'Tự','叛':'Phản','叠':'Điệp','口':'Khẩu',
        '古':'Cổ','句':'Cú','另':'Lánh','只':'Chỉ','叫':'Khiếu','召':'Triệu','可':'Khả','台':'Đài','史':'Sử','右':'Hữu',
        '叶':'Diệp','号':'Hiệu','司':'Tư','叹':'Thán','吃':'Cật','各':'Các','合':'Hợp','吉':'Cát','吊':'Điếu','同':'Đồng',
        '名':'Danh','后':'Hậu','吏':'Lại','吐':'Thổ','向':'Hướng','君':'Quân','吟':'Ngâm','吠':'Phệ','否':'Phủ','吧':'Ba',
        '吨':'Tấn','含':'Hàm','听':'Thính','启':'Khải','吴':'Ngô','吵':'Sảo','吸':'Hấp','吹':'Xúy','吻':'Vẫn','吾':'Ngô',
        '呀':'Nha','呆':'Ngốc','呈':'Trình','告':'Cáo','呐':'Nột','员':'Viên','呜':'Ô','呢':'Ni','周':'Chu','味':'Vị',
        '呵':'Hà','呸':'Phôi','呼':'Hô','命':'Mệnh','和':'Hòa','咖':'Cà','啡':'Phê','咒':'Chú','咸':'Hàm','品':'Phẩm',
        '哈':'Háp','响':'Hưởng','哥':'Ca','哩':'Lý','哪':'Nào','哭':'Khốc','哮':'Háo','哲':'Triết','哺':'Bộ','哼':'Hanh',
        '唆':'Toa','唇':'Thần','唉':'Ai','唐':'Đường','唤':'Hoán','售':'Thụ','唯':'Duy','唱':'Xướng','念':'Niệm','鸟':'Điểu'
    };

    let vocabList = JSON.parse(localStorage.getItem('my_infinite_vocab')) || [];
    let currentFilter = 'all';
    let currentCardIndex = -1;
    let chartInstance = null;

    // Tra cứu âm Hán Việt
    function getHanViet(text) {
        return text.split('').map(char => hanVietDict[char] || '').filter(Boolean).join(' ');
    }

    // Tự động xử lý khi gõ chữ Hán
    function autoProcessHanzi() {
        const input = document.getElementById('hanziInput').value.trim();
        if (input) {
            document.getElementById('pinyinInput').value = pinyin(input, { toneType: 'symbol' });
            const hv = getHanViet(input);
            if (hv) document.getElementById('hanvietInput').value = hv;
        } else {
            document.getElementById('pinyinInput').value = '';
            document.getElementById('hanvietInput').value = '';
        }
    }

    function initChart() {
        const ctx = document.getElementById('vocabChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Đã thuộc', 'Chưa thuộc'],
                datasets: [{
                    data: [0, 0],
                    backgroundColor: ['#34c759', '#ff3b30'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } }
            }
        });
    }

    function addWord() {
        const hanzi = document.getElementById('hanziInput').value.trim();
        const py = document.getElementById('pinyinInput').value.trim();
        const hv = document.getElementById('hanvietInput').value.trim();
        const meaning = document.getElementById('meaningInput').value.trim();

        if (!hanzi || !meaning) {
            alert('Vui lòng nhập Chữ Hán và Nghĩa!');
            return;
        }

        vocabList.push({
            id: Date.now(),
            hanzi: hanzi,
            pinyin: py,
            hanviet: hv,
            meaning: meaning,
            status: 'unlearned',
            seenCount: 0
        });

        saveData();
        document.getElementById('hanziInput').value = '';
        document.getElementById('pinyinInput').value = '';
        document.getElementById('hanvietInput').value = '';
        document.getElementById('meaningInput').value = '';

        updateUI();
        loadNextCard();
    }

    function saveData() {
        localStorage.setItem('my_infinite_vocab', JSON.stringify(vocabList));
    }

    function updateUI() {
        const total = vocabList.length;
        const learned = vocabList.filter(v => v.status === 'learned').length;
        const unlearned = total - learned;

        document.getElementById('totalCount').innerText = total;
        document.getElementById('learnedCount').innerText = learned;
        document.getElementById('unlearnedCount').innerText = unlearned;

        if (chartInstance) {
            chartInstance.data.datasets[0].data = [learned, unlearned];
            chartInstance.update();
        }
    }

    function setFilter(filter) {
        currentFilter = filter;
        document.getElementById('filterAllBtn').classList.toggle('active', filter === 'all');
        document.getElementById('filterUnlearnedBtn').classList.toggle('active', filter === 'unlearned');
        loadNextCard();
    }

    function loadNextCard() {
        let pool = vocabList;
        if (currentFilter === 'unlearned') {
            pool = vocabList.filter(v => v.status === 'unlearned');
        }

        const cardElem = document.getElementById('flashcard');
        cardElem.classList.remove('flipped');

        if (pool.length === 0) {
            document.getElementById('displayHanzi').innerText = "Hết từ ôn!";
            document.getElementById('displayPinyin').innerText = "";
            document.getElementById('displayHanViet').innerText = "";
            document.getElementById('displayMeaning').innerText = "";
            document.getElementById('seenCount').innerText = "";
            currentCardIndex = -1;
            return;
        }

        // Cân bằng tần suất hiển thị
        pool.sort((a, b) => a.seenCount - b.seenCount);
        const minSeen = pool[0].seenCount;
        const candidatePool = pool.filter(v => v.seenCount === minSeen);
        
        const selected = candidatePool[Math.floor(Math.random() * candidatePool.length)];
        currentCardIndex = vocabList.findIndex(v => v.id === selected.id);

        document.getElementById('displayHanzi').innerText = selected.hanzi;
        document.getElementById('displayPinyin').innerText = selected.pinyin;
        document.getElementById('displayHanViet').innerText = selected.hanviet ? `[${selected.hanviet}]` : '';
        document.getElementById('displayMeaning').innerText = selected.meaning;
        document.getElementById('seenCount').innerText = `Hiện: ${selected.seenCount}`;
    }

    function markCard(isLearned) {
        if (currentCardIndex === -1 || vocabList.length === 0) return;

        const item = vocabList[currentCardIndex];
        item.status = isLearned ? 'learned' : 'unlearned';
        item.seenCount += 1;

        saveData();
        updateUI();

        const cardElem = document.getElementById('flashcard');
        cardElem.style.transform = isLearned ? 'translateX(-120%) rotate(-10deg)' : 'translateX(120%) rotate(10deg)';
        cardElem.style.opacity = '0';

        setTimeout(() => {
            cardElem.style.transform = '';
            cardElem.style.opacity = '1';
            loadNextCard();
        }, 300);
    }

    document.getElementById('flashcard').addEventListener('click', function() {
        this.classList.toggle('flipped');
    });

    // Thao tác Vuốt (Swipe)
    let startX = 0;
    const cardElem = document.getElementById('flashcard');

    cardElem.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
    cardElem.addEventListener('touchend', e => {
        let diffX = e.changedTouches[0].clientX - startX;
        if (diffX < -50) markCard(true);
        if (diffX > 50) markCard(false);
    });

    window.onload = function() {
        initChart();
        updateUI();
        loadNextCard();
    };
</script>

</body>
</html>
